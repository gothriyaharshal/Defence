<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="FifthMiniProject.css">
    <title>Document</title>
</head>
<body>

<div class="wrapper">
<h1>University Registration Form</h1>
<p>Please fill out the form below to register</p>

<hr>

<h2>Personal Details</h2>
<br>
<form>
    <label for="fname">First Name:</label>
    <input type="text" id="fname" name="fname" placeholder="Your first name.." required>
    <br><br>

    <label for="lname">Last Name:</label>
    <input type="text" id="lname" name="lname" placeholder="Your last name.." required>
    <br><br>


    <label for="date">Date of Birth:</label>
    <input type="date" id="date" name="date" required>
    <br><br>


    <h3>Gender</h3>
    <input type="radio" id="male" name="gender" value="male" required><label for="male">Male</label><br>
    <input type="radio" id="female" name="gender" value="female"><label for="female">female</label><br>
    <input type="radio" id="other" name="gender" value="other"><label for="other">Other</label><br>

    <br><br>

    <h3>Upload your Photo:</h3>
    <input type="file" id="img" name="img"><br>

    <hr>

    <h2>Contact Details</h2>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>
    <br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>
    <br><br>

    <label for="address">Mailinig Address:</label>
    <br>
    <textarea id="address" name="address" placeholder="Stree Address , City , State" required>
        </textarea>
    <br><br>


    <hr>
    <h2>Academic Information</h2>

    <label for="course">Select Your Course:</label>
    <select id="course" name="course">
        <option>--Choose a Course--</option>
        <option value="java">java</option>
        <option value="python">python</option>
        <option value="c++">c++</option>
        <option value="html">html</option>
    </select>

    <br><br>

    <label>ExtraCurricular Interests</label><br>
    <input type="checkbox" id="sports" name="extra" value="sports"><label for="sports">Sports</label><br>
    <input type="checkbox" id="science" name="extra" value="science"><label for="science">Science</label><br>
    <input type="checkbox" id="technology" name="extra" value="technology"><label
        for="technology">Technology</label><br>


    <hr>

    <h2>Create Your Account</h2>
    <label for="password">Password : </label>
    <input type="password" id="password" name="password" required>

    <br><br>
    <label for="security_question">Security Question :</label>
    <select id="security_question" name="security_question">
        <option>--Choose a Security Question--</option>
        <option value="Harry">Harry</option>
        <option value="Shalu">Sidhi</option>
        <option value="samir">Samir</option>
    </select>
    <br><br>

    <label for="Security_ans">Security Answer : </label>
    <input type="text" id="Security_ans" name="Security_ans" required>
    <br><br>

    <input type="checkbox" value="I agree to the Terms and Conditions" id="agree">
    <label for="agree">I agree to the Terms and Conditions</label>


    <br>
    <hr>
    <button type="submit">Register</button>
    <button type="reset">Clear Form</button>
</form>
<hr>
</div>

</body>
</html>
